name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Portable configuration
        run: python -m unittest discover -s tests -p test_app_config.py
      - name: Fresh install and tutorial example
        run: python -m unittest discover -s tests -p test_packaged_startup.py
      - name: Comment evidence library
        run: python -m unittest discover -s tests -p test_review_store.py
      - name: Comment topic opportunities
        run: python -m unittest discover -s tests -p test_review_opportunities.py
      - name: Local API
        run: python -m unittest discover -s tests -p test_server.py
